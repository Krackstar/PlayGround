<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dragon Sphere GT: Final Bout 2</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090613;font-family:Impact,"Arial Black",sans-serif}#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#15112b;color:#fff;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:absolute;left:0;right:0;top:0;height:128px;z-index:5;padding:18px 4.5%;pointer-events:none}.top{display:flex;align-items:flex-start;justify-content:space-between}.barbox{width:38%}.name{height:22px;font-size:17px;letter-spacing:2px;text-shadow:2px 2px #111}.bar{position:relative;height:25px;background:#26172e;border:3px solid #fff;box-shadow:4px 4px 0 #111;transform:skewX(-14deg);overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff3e3e,#ff9b22);transition:width .12s}.barbox.right{text-align:right}.right .bar{transform:skewX(14deg)}.right .fill{margin-left:auto}.energy{width:80%;height:7px;margin-top:5px;border:2px solid #fff;background:#28166a}.right .energy{margin-left:auto}.timer{text-align:center;width:105px;height:64px;margin-top:-8px;background:#ffbf21;color:#25102d;font-size:52px;line-clamp:1;line-height:59px;border:4px solid #fff;box-shadow:5px 5px 0 #111;transform:skewX(-8deg)}.screen{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(49,37,130,.78),rgba(8,5,22,.96));text-align:center}.hidden{display:none!important}.panel{width:min(680px,90vw);padding:28px 20px}.logo{font-size:clamp(42px,8vw,82px);line-height:.78;color:#ffe429;-webkit-text-stroke:3px #d45a08;text-shadow:5px 5px 0 #b62927,10px 10px 0 #30134c;transform:rotate(-3deg);margin-bottom:22px}.logo small{display:block;font-size:.34em;color:#fff;-webkit-text-stroke:1px #5d2ba7;text-shadow:3px 3px #222;margin:10px}.selectrow{display:flex;gap:14px;justify-content:center}.fighter{width:170px;height:230px;border:4px solid #fff;background:linear-gradient(145deg,#ef3b36,#5c183f);box-shadow:7px 7px 0 #111;cursor:pointer;color:#fff;font-family:Impact,sans-serif}.fighter:nth-child(2){background:linear-gradient(145deg,#4c9cff,#322079)}.fighter:nth-child(3){background:linear-gradient(145deg,#a5dc38,#286b35)}.portrait{height:150px;display:flex;align-items:center;justify-content:center;font-size:90px}.fighter b{display:block;font-size:24px}.fighter small{color:#ffe429}.btn{border:3px solid #fff;background:#f7c52a;color:#25102d;padding:12px 28px;font:24px Impact,sans-serif;box-shadow:5px 5px #111;cursor:pointer;margin-top:22px}.controls{position:absolute;z-index:10;left:0;right:0;bottom:16px;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}.pad,.actions{pointer-events:auto}.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px}.actions{display:flex;align-items:flex-end;gap:12px}.key{width:58px;height:58px;border:3px solid rgba(255,255,255,.75);border-radius:50%;background:rgba(20,15,48,.48);color:#fff;font:26px Impact,sans-serif;touch-action:none}.key:active{background:#f3bd26;color:#241431}.up{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.kick{width:72px;height:72px;border-radius:50%;background:rgba(230,67,56,.65)}.special{width:66px;height:66px;border-radius:50%;background:rgba(55,120,255,.65)}.message{position:absolute;z-index:8;left:50%;top:42%;transform:translate(-50%,-50%);font-size:68px;color:#ffe429;-webkit-text-stroke:2px #b52b29;text-shadow:5px 5px #111;opacity:0}.combo{position:absolute;z-index:7;left:8%;top:38%;font-size:24px;color:#ffe429;text-shadow:3px 3px #111}.combo.rightc{left:auto;right:8%;text-align:right}@media(max-width:700px){.hud{height:90px;padding:10px 2.5%}.name{font-size:12px;height:16px}.bar{height:18px}.timer{width:68px;height:46px;font-size:34px;line-height:42px}.controls{padding:0 8px}.key{width:48px;height:48px}.pad{grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px}.kick{width:62px;height:62px}.selectrow{gap:7px}.fighter{width:28vw;max-width:150px;height:210px}.portrait{height:130px}.logo{-webkit-text-stroke:2px #d45a08}}
</style></head>
<body><div id="game"><canvas id="c"></canvas>
<div class="hud"><div class="top"><div class="barbox"><div class="name" id="p1name">GOKU</div><div class="bar"><div class="fill" id="hp1"></div></div><div class="energy" id="en1"></div></div><div class="timer" id="timer">99</div><div class="barbox right"><div class="name" id="p2name">VEGETA</div><div class="bar"><div class="fill" id="hp2"></div></div><div class="energy" id="en2"></div></div></div></div>
<div class="message" id="msg">K.O.</div><div class="combo" id="combo1"></div><div class="combo rightc" id="combo2"></div>
<div class="controls"><div class="pad"><button class="key up" data-key="w">▲</button><button class="key left" data-key="a">◀</button><button class="key right" data-key="d">▶</button></div><div class="actions"><button class="key kick" data-key="j">J</button><button class="key special" data-key="k">K</button></div></div>
<div class="screen" id="menu"><div class="panel"><div class="logo">DRAGON SPHERE<small>GT • FINAL BOUT 2</small></div><div class="selectrow"><button class="fighter" data-pick="Goku"><div class="portrait">🔥</div><b>GOKU</b><small>THE WARRIOR</small></button><button class="fighter" data-pick="Vegeta"><div class="portrait">⚡</div><b>VEGETA</b><small>THE PRINCE</small></button><button class="fighter" data-pick="Broly"><div class="portrait">💥</div><b>BROLY</b><small>THE LEGEND</small></button></div><button class="btn" id="start">FIGHT</button><div style="margin-top:20px;font:14px Arial,sans-serif;letter-spacing:1px;color:#d9d4f4">MOVE: WASD / ARROWS &nbsp; • &nbsp; STRIKE: J &nbsp; • &nbsp; KI BLAST: K</div></div></div>
</div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,G,scale=1;
const menu=document.getElementById('menu'),timerEl=document.getElementById('timer'),msg=document.getElementById('msg');
let selected='Goku',running=false,time=99,last=0,shake=0;
const make=(x,side,color)=>({x,y:0,vx:0,vy:0,side,color,hp:100,energy:0,attack:0,cool:0,hit:0,combo:0,comboT:0,flash:0});
let p1,p2,particles=[],projectiles=[];
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);G=innerHeight*.82;scale=innerWidth/900}resize();addEventListener('resize',resize);
const keys={};const normalizeKey=k=>({arrowleft:'a',arrowright:'d',arrowup:'w',arrowdown:'s',' ':'k'}[k.toLowerCase()]||k.toLowerCase());addEventListener('keydown',e=>{let k=normalizeKey(e.key);keys[k]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[normalizeKey(e.key)]=false);
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const dn=e=>{e.prevent;keys[k]=true};const up=e=>{e.prevent;keys[k]=false};b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)});
document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selected=b.dataset.pick;document.querySelectorAll('.fighter').forEach(x=>x.style.filter='');b.style.filter='brightness(1.25) saturate(1.4)';document.getElementById('p1name').textContent=selected.toUpperCase()});
document.getElementById('start').onclick=start;
function start(){menu.classList.add('hidden');p1=make(innerWidth*.22,1,selected==='Vegeta'?'#3e73de':selected==='Broly'?'#53b936':'#ffdf4d');p2=make(innerWidth*.78,-1,selected==='Broly'?'#53b936':'#6b63db');p1.h=190;p2.h=190;p1.name=selected;p2.name=selected==='Vegeta'?'Goku':'Vegeta';p1.y=p2.y=G-175;running=true;time=99;particles=[];projectiles=[];document.getElementById('p2name').textContent=p2.name.toUpperCase();document.getElementById('p1name').textContent=p1.name.toUpperCase();msg.textContent='FIGHT';msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,700);last=performance.now();requestAnimationFrame(loop)}
function damage(a,b,n,knock){if(b.hit)return;let dist=Math.abs(a.x-b.x);if(dist<125&&dist>-20&&Math.abs(a.y-b.y)<100){b.hp=Math.max(0,b.hp-n);b.vx=a.side*knock;b.hit=.18;b.flash=.12;b.combo++;b.comboT=1;a.energy=Math.min(100,a.energy+12);b.energy=Math.min(100,b.energy+8);shake=8;for(let i=0;i<12;i++)particles.push({x:b.x,y:b.y-85,vx:(Math.random()-0.5)*350,vy:(Math.random()-0.6)*260,life:.5,color:'#ffe84d'});a.attack=0}}
function update(dt){if(!running)return;time-=dt;if(time<=0)end(p1.hp>=p2.hp?p1:p2);
for(let p of [p1,p2]){p.vx*=.86;p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>G-175){p.y=G-175;p.vy=0}p.x=Math.max(55,Math.min(innerWidth-55,p.x));p.hit=Math.max(0,p.hit-dt);p.flash=Math.max(0,p.flash-dt);p.cool=Math.max(0,p.cool-dt);p.attack=Math.max(0,p.attack-dt);p.comboT-=dt;if(p.comboT<=0)p.combo=0}
if(keys.a)p1.vx-=900*dt;if(keys.d)p1.vx+=900*dt;if(keys.w&&p1.y>=G-176)p1.vy=-520;if(keys.j&&p1.cool<=0){p1.attack=.25;p1.cool=.34;damage(p1,p2,7,280)}if(keys.k&&p1.cool<=0&&p1.energy>=20){p1.cool=.8;p1.energy-=20;projectiles.push({x:p1.x+p1.side*40,y:p1.y-95,vx:p1.side*520,life:1.5,side:p1.side})}
// Simple AI
if(p2.x>p1.x+105)p2.vx-=650*dt;if(p2.x<p1.x-105)p2.vx+=650*dt;if(Math.abs(p2.x-p1.x)<115&&!p2.cool){if(Math.random()<.025){p2.attack=.22;p2.cool=.45;damage(p2,p1,6,240)}}
if(p2.hp>0&&p1.hp>0){for(let q of projectiles){q.x+=q.vx*dt;q.life-=dt;if(Math.abs(q.x-p2.x)<65&&q.y>p2.y-145&&q.y<p2.y){p2.hp=Math.max(0,p2.hp-14);p2.vx=q.side*380;p2.hit=.25;shake=10;q.life=0}}projectiles=projectiles.filter(q=>q.life>0)}
if(p1.hp<=0||p2.hp<=0)end(p1.hp>=p2.hp?p1:p2);
document.getElementById('hp1').style.width=p1.hp+'%';document.getElementById('hp2').style.width=p2.hp+'%';document.getElementById('en1').style.width=p1.energy+'%';document.getElementById('en2').style.width=p2.energy+'%';timerEl.textContent=Math.max(0,Math.ceil(time));for(let d of particles){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=500*dt;d.life-=dt}particles=particles.filter(d=>d.life>0);shake*=.82}
function end(winner){running=false;msg.textContent=winner===p1?'YOU WIN':'K.O.';msg.style.opacity=1;setTimeout(()=>{menu.classList.remove('hidden');msg.style.opacity=0;document.querySelector('.logo').innerHTML='DRAGON SPHERE<small>GT • FINAL BOUT 2</small>'},1800)}
function drawBg(){ctx.fillStyle='#141138';ctx.fillRect(0,0,innerWidth,innerHeight);let sky=ctx.createLinearGradient(0,0,0,G);sky.addColorStop(0,'#5c65ad');sky.addColorStop(.7,'#d19c72');sky.addColorStop(1,'#24154a');ctx.fillStyle=sky;ctx.fillRect(0,0,innerWidth,G);ctx.fillStyle='#f4b66b';ctx.beginPath();ctx.arc(innerWidth*.72,G*.28,62,0,7);ctx.fill();ctx.fillStyle='#1c1a46';ctx.beginPath();ctx.moveTo(0,G*.58);for(let x=0;x<=innerWidth;x+=100){ctx.quadraticCurveTo(x+50,G*.45-Math.random()*0*55,x+100,G*.58)}ctx.lineTo(innerWidth,G);ctx.lineTo(0,G);ctx.fill();ctx.fillStyle='#eee1ba';ctx.fillRect(0,G,innerWidth,innerHeight-G);ctx.strokeStyle='rgba(90,64,43,.18)';for(let y=G;y<innerHeight;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(innerWidth,y);ctx.stroke()}for(let x=-400;x<innerWidth+400;x+=180){ctx.beginPath();ctx.moveTo(innerWidth/2,G);ctx.lineTo(x,innerHeight);ctx.stroke()}}
function drawFighter(p){ctx.save();ctx.translate(p.x+(shake*(Math.random()-.5)),p.y);ctx.scale(p.side,1);if(p.flash>0)ctx.globalAlpha=.7;ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,10,54,12,0,0,7);ctx.fill();ctx.translate(0,p.attack>0?-8:0);
// aura
ctx.strokeStyle=p.energy>70?'#ffe66a':'rgba(100,180,255,.25)';ctx.lineWidth=p.energy>70?8:3;ctx.beginPath();ctx.ellipse(0,-75,65,105,0,0,7);ctx.stroke();ctx.fillStyle=p.hit>0?'#fff':p.color;ctx.beginPath();ctx.moveTo(-34,-75);ctx.quadraticCurveTo(-45,-120,-18,-150);ctx.quadraticCurveTo(0,-170,18,-150);ctx.quadraticCurveTo(45,-120,34,-75);ctx.lineTo(25,-20);ctx.lineTo(-25,-20);ctx.fill();ctx.fillStyle='#3a2422';ctx.fillRect(-13,-24,26,24);ctx.fillStyle=p.color;ctx.beginPath();ctx.moveTo(-24,-50);ctx.lineTo(-58,-p.attack>0?125:145);ctx.lineTo(-42,-p.attack>0?95:105);ctx.lineTo(-10,-45);ctx.fill();ctx.beginPath();ctx.moveTo(24,-50);ctx.lineTo(p.attack>0?68:48,-p.attack>0?125:145);ctx.lineTo(p.attack>0?62:34,-p.attack>0?100:105);ctx.lineTo(10,-45);ctx.fill();ctx.fillStyle='#f1c59a';ctx.beginPath();ctx.arc(0,-135,29,0,7);ctx.fill();ctx.fillStyle='#17131f';ctx.beginPath();ctx.moveTo(-29,-145);ctx.lineTo(-16,-170);ctx.lineTo(-5,-151);ctx.lineTo(8,-174);ctx.lineTo(29,-145);ctx.quadraticCurveTo(9,-158,-29,-145);ctx.fill();ctx.fillStyle='#ff4a48';ctx.fillRect(-19,-137,10,4);ctx.fillRect(10,-137,10,4);ctx.restore()}
function draw(){drawBg();for(let q of projectiles){ctx.save();ctx.translate(q.x,q.y);ctx.fillStyle='#78d7ff';ctx.shadowColor='#6ccfff';ctx.shadowBlur=25;ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.fill();ctx.restore()}if(p1&&p2){drawFighter(p1);drawFighter(p2)}for(let d of particles){ctx.globalAlpha=Math.max(0,d.life*2);ctx.fillStyle=d.color;ctx.fillRect(d.x,d.y,5,5)}ctx.globalAlpha=1}
function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();if(running||particles.length)requestAnimationFrame(loop)}draw();
</script></body></html>
